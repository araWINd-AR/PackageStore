{% extends "base.html" %}
{% block title %}Package Store | Login{% endblock %}
{% block content %}
<section class="page-title">
    <h1>Login</h1>
    <p>Session-based login for the Package Store demo.</p>
</section>

<section class="auth-card store-card">
    <form method="post">
        <label>Email</label>
        <input class="form-control mb-3" type="email" name="email" required>

        <label>Password</label>
        <input class="form-control mb-3" type="password" name="password" required>

        <button class="btn btn-warning w-100" type="submit">Login</button>
    </form>
    <p class="mt-3">Need an account? <a href="{{ url_for('register') }}">Register</a></p>
</section>
{% endblock %}
