{% extends "base.html" %}
{% block title %}Package Store | Register{% endblock %}
{% block content %}
<section class="page-title">
    <h1>Create Account</h1>
    <p>Demo user management using Flask sessions and hashed passwords.</p>
</section>

<section class="auth-card store-card">
    <form method="post">
        <label>Full Name</label>
        <input class="form-control mb-3" type="text" name="full_name" required>

        <label>Email</label>
        <input class="form-control mb-3" type="email" name="email" required>

        <label>Password</label>
        <input class="form-control mb-3" type="password" name="password" required>

        <button class="btn btn-warning w-100" type="submit">Register</button>
    </form>
    <p class="mt-3">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</section>
{% endblock %}
